<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>neo-cucumber painter example</title>
  </head>
  <body>
    <div id="painter"></div>
    <div style="position:fixed;bottom:0;left:0;right:0;z-index:80;padding:8px;background:#ccccff">
      <button id="replay" type="button">Replay what I drew</button>
      <button id="download" type="button">Download .pch</button>
      <label>Open a .pch… <input id="open" type="file" accept=".pch,application/octet-stream" /></label>
      <span id="status"></span>
      <div id="viewer"></div>
    </div>
    <script type="module" src="/src/example.ts"></script>
  </body>
</html>
