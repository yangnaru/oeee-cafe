# To use sccache caching, enable BuildKit before running docker-compose:
#   export DOCKER_BUILDKIT=1
#   export COMPOSE_DOCKER_CLI_BUILD=1
# Or run with: DOCKER_BUILDKIT=1 COMPOSE_DOCKER_CLI_BUILD=1 docker-compose build

services:
  oeee-cafe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # deploy.sh exports this from the checked-out commit.
        GIT_COMMIT: ${GIT_COMMIT:-}
    container_name: oeee-cafe
    ports:
      - "30000:3000"
    volumes:
      - ./config:/app/config:ro
    networks:
      - oeee-cafe-network
    restart: always
    # On SIGTERM the server waits up to 10s for open drawing sessions to close
    # cleanly. Docker's default 10s grace period would SIGKILL it right as that
    # wait expires, so give it room to finish and exit on its own.
    stop_grace_period: 20s
    # `restart: always` only notices a process that exited. This catches the
    # other failure: still running, but unable to reach the database.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  oeee-cafe-network:
    driver: bridge
